name: Deployment configuration checks
on:
  push:
    branches: [main, staging]
    paths:
      - "deployment/**"
      - ".github/workflows/*deploy*.yml"
  pull_request:
    paths:
      - "deployment/**"
      - ".github/workflows/*deploy*.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python -m unittest discover -s deployment/backend/staging -p "test_*.py" -v
      - run: python -m unittest discover -s deployment/frontend/cloudflare -p "test_*.py" -v
