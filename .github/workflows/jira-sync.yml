name: Jira sync

on:
  schedule:
    # Target: 01:00 IST daily (IST = UTC+5:30, no DST), i.e. 19:30 UTC the
    # previous day. NOT set to 19:30 UTC directly -- GitHub's
    # scheduled-workflow queue for this repo has a real, stable queuing
    # delay that has grown over time. Re-measured 2026-09-13 through
    # 2026-09-18 with the cron firing at 01:40 UTC: actual executions
    # landed 06:34-06:58 UTC, i.e. ~4h54m-5h18m late (avg ~5h01m) -- up
    # from the ~2h49m average delay observed when this schedule was first
    # tuned (2026-07-29 - 2026-08-05), when it targeted 10:00 IST instead.
    # Firing at 14:29 UTC (~5h01m ahead of the 19:30 UTC target) lands
    # actual execution close to 19:30 UTC / 01:00 IST given the current
    # delay. This is an empirical compensation, not a guarantee -- the
    # delay has already drifted once and will likely drift again, so if
    # sync data starts looking stale, re-measure and re-adjust (see run
    # history:
    # `gh api repos/OWNER/REPO/actions/workflows/jira-sync.yml/runs` and
    # compare each schedule-triggered run's created_at against 19:30 UTC).
    - cron: "29 14 * * *"
  workflow_dispatch:
    inputs:
      sync_type:
        description: "full (re-derive everything + reseed history) or incremental (default)"
        required: false
        default: "incremental"
        type: choice
        options: [incremental, full]

permissions:
  contents: read
  issues: write

# Two overlapping syncs interleave delete-then-insert sequences on the
# derived tables (risks, standouts, project_contributors...) -- a manual
# dispatch landing mid-scheduled-run would corrupt them. Queue instead of
# cancel: cancelling a half-finished sync wastes the Jira fetch it
# already did, and the queued run starts from the committed previous state.
concurrency:
  group: jira-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm ci honors package-lock.json (pinned versions); a bare
      # `npm install` ignores it and can silently pick up a breaking new
      # pg release. pg is already in dependencies, so nothing extra needed.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run Jira -> Supabase sync
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          SYNC_TYPE="${{ github.event.inputs.sync_type || 'incremental' }}"
          node scripts/jira-sync/run-full-sync.mjs --$SYNC_TYPE

      # The stale-DB-password incident ran silently for 2+ days because
      # nothing surfaced the failure -- this opens (or reuses) a single
      # tracking issue the moment a run fails, so the next scheduled
      # failure gets noticed same-day instead of found by chance days
      # later. No new secret needed -- issues: write above is enough.
      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Jira sync failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled Jira sync failed.\n\nRun: ${runUrl}\nTriggered: ${new Date().toISOString()}\n\nCheck the run's logs for the failing step -- this is most often an expired/rotated \`SUPABASE_DB_URL\`, \`JIRA_API_TOKEN\`, or the post-sync smoke test catching a write that silently didn't happen.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "sync-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["sync-failure"],
              });
            }
