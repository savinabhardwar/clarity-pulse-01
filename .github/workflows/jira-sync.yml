name: Jira sync

on:
  schedule:
    # Target: 10:00 IST daily (IST = UTC+5:30, no DST). NOT set to 04:30
    # UTC (the literal 10:00 IST instant) -- GitHub's scheduled-workflow
    # queue for this repo has consistently run 2h33m-3h27m late every
    # single day since this schedule was introduced (2026-07-29 through
    # 2026-08-05: actual executions landed 07:03-07:57 UTC every day,
    # never near 04:30), not the "a few minutes" best-effort slip GitHub
    # documents -- a real, stable queuing delay for this repo/account.
    # Firing at 01:40 UTC (07:10 IST), ~2h49m (the observed average
    # delay) before the real target, lands actual execution close to
    # 10:00 IST given that delay. This is an empirical compensation, not
    # a guarantee -- if the delay's magnitude shifts, this trigger time
    # should be re-measured and adjusted (see run history:
    # `gh api repos/OWNER/REPO/actions/workflows/jira-sync.yml/runs` and
    # compare each schedule-triggered run's created_at against 04:30 UTC).
    - cron: "40 1 * * *"
  workflow_dispatch:
    inputs:
      sync_type:
        description: "full (re-derive everything + reseed history) or incremental (default)"
        required: false
        default: "incremental"
        type: choice
        options: [incremental, full]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install sync script dependencies
        run: npm install --omit=dev pg

      - name: Run Jira -> Supabase sync
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          SYNC_TYPE="${{ github.event.inputs.sync_type || 'incremental' }}"
          node scripts/jira-sync/run-full-sync.mjs --$SYNC_TYPE

      # The stale-DB-password incident ran silently for 2+ days because
      # nothing surfaced the failure -- this opens (or reuses) a single
      # tracking issue the moment a run fails, so the next scheduled
      # failure gets noticed same-day instead of found by chance days
      # later. No new secret needed -- issues: write above is enough.
      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Jira sync failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled Jira sync failed.\n\nRun: ${runUrl}\nTriggered: ${new Date().toISOString()}\n\nCheck the run's logs for the failing step -- this is most often an expired/rotated \`SUPABASE_DB_URL\`, \`JIRA_API_TOKEN\`, or the post-sync smoke test catching a write that silently didn't happen.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "sync-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["sync-failure"],
              });
            }
