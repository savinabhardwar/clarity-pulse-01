name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pipeline tests
        # scoring-parity.test.mjs skips itself when the engineering-ethos
        # sibling checkout isn't present, so this is safe on CI. Uses
        # `npm test` (not a duplicated raw `node --test` command) so this
        # step never drifts from package.json's own test script again --
        # the previous raw command passed a bare directory instead of the
        # glob package.json already uses, which fails with MODULE_NOT_FOUND
        # on Node 22 (silently never caught before, since Lint always
        # failed first).
        run: npm test

      - name: Build
        run: npm run build
