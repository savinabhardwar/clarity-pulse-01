name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pipeline tests
        # scoring-parity.test.mjs skips itself when the engineering-ethos
        # sibling checkout isn't present, so this is safe on CI.
        run: node --test scripts/jira-sync/__tests__/

      - name: Build
        run: npm run build
