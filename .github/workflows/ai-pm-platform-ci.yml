name: AI PM Platform CI

on:
  push:
    branches: [main]
    paths:
      - "ai-pm-platform/**"
      - ".github/workflows/ai-pm-platform-ci.yml"
  pull_request:
    paths:
      - "ai-pm-platform/**"
      - ".github/workflows/ai-pm-platform-ci.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-pm-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-pm-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ai-pm-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-pm-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Explicit --config avoids wrangler's upward config auto-discovery
      # colliding with the unrelated .wrangler/deploy/config.json that
      # already exists at the repo root (belongs to the root app's own
      # prior Cloudflare Pages/Nitro build) -- see task 1.3.
      - name: Deploy hello-world Worker
        working-directory: ai-pm-platform/workers/hello-world
        run: npx wrangler deploy --config ./wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
