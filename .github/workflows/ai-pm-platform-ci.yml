name: Python automation CI

on:
  push:
    branches: [main]
    paths: ["backend/automation/**", ".github/workflows/ai-pm-platform-ci.yml"]
  pull_request:
    paths: ["backend/automation/**", ".github/workflows/ai-pm-platform-ci.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/automation/package-lock.json
      - run: npm ci
      - run: python -m pip install uv
      - run: uv sync --locked
      - name: Python API and normalization tests
        run: uv run python -m unittest discover -s tests -v
      - name: Load all Python workers in local Cloudflare runtime
        run: uv run python tests/smoke_workers.py

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/automation/package-lock.json
      - run: npm ci
      - run: python -m pip install uv
      - run: uv sync --locked
      # Preserve the original hello-world-only deployment scope.
      - name: Deploy hello-world Worker
        run: uv run pywrangler deploy --config wrangler.hello-world.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
