name: Release notes

on:
  schedule:
    # Daily check for products whose "Next Release Date" (set by hand on
    # the Confluence "Release Schedule" page) is today. See
    # scripts/release-notes/run.mjs -- it's a no-op on days nothing is due.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Jira key or product name to run for (optional -- omit to check the full schedule)"
        required: false
        type: string
      dry_run:
        description: "Log the would-be summary without publishing to Confluence"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run release-notes automation
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.project }}" ]; then ARGS="$ARGS --project ${{ github.event.inputs.project }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/release-notes/run.mjs $ARGS

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Release notes automation failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled release-notes job failed.\n\nRun: ${runUrl}\nTriggered: ${new Date().toISOString()}\n\nCheck the run's logs -- this is most often an expired \`JIRA_API_TOKEN\`/\`GEMINI_API_KEY\`, or a Confluence page structure change under the Release Notes space.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "release-notes-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["release-notes-failure"],
              });
            }
