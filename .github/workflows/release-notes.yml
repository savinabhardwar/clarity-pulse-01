name: Release notes

on:
  schedule:
    # Daily check for products whose "Next Release Date" (set by hand on
    # the Confluence "Release Schedule" page) is today. See
    # backend/app/jobs/release_notes/runner.py -- it's a no-op on days nothing is due.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Jira key or product name to run for (optional -- omit to check the full schedule)"
        required: false
        type: string
      dry_run:
        description: "Log the would-be summary without publishing to Confluence"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -e ./backend

      - name: Run release-notes automation
        working-directory: backend
        env:
          INPUT_PROJECT: ${{ github.event.inputs.project }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ARGS=()
          if [ -n "$INPUT_PROJECT" ]; then ARGS+=(--project "$INPUT_PROJECT"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m app.jobs.release_notes.runner "${ARGS[@]}"

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Release notes automation failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled release-notes job failed.\n\nRun: ${runUrl}\nTriggered: ${new Date().toISOString()}\n\nCheck the run's logs -- this is most often an expired \`JIRA_API_TOKEN\`/\`GEMINI_API_KEY\`, or a Confluence page structure change under the Release Notes space.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "release-notes-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["release-notes-failure"],
              });
            }
