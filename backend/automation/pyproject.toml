[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-pulse-automation"
version = "0.1.0"
description = "Python FastAPI ingestion and event processing workers"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "uvicorn>=0.30,<1", "workers-runtime-sdk>=1.9,<2"]

[project.optional-dependencies]
database = ["psycopg2-binary>=2.9,<3"]

[dependency-groups]
dev = ["workers-py>=1.17,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_pm*"]
